name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install -r requirements.txt
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm ci
      - run: npm run build
      - run: node --test tests/*.test.js
      - run: node --check static/app.js
      - run: node --check static/combat/calculation-engine.js
      - run: node --check static/combat/effect-validation.js
      - run: |
          node --check static/combat/build-compiler.js
          node --check static/combat/combat-state.js
          node --check static/combat/combat-runtime.js
          node --check static/training-grounds/training-grounds.js
          node --check static/training-grounds/training-grounds-ui.js
      - run: |
          for module in static/world/*.js static/world/combat/*.js static/training-grounds/world-integration.js; do
            node --check "$module"
          done
      - run: python3 -m pip install playwright
      - run: python3 -m playwright install --with-deps chromium
      - name: Locate Chromium for existing browser tests
        run: sudo ln -sf "$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" /usr/bin/chromium
      - name: Browser regressions
        run: |
          python3 tests/browser_calculation.py
          python3 tests/browser_talent_regression.py
          python3 tests/browser_combat_effects.py
          python3 tests/browser_ability_scopes.py
          python3 tests/browser_calculator_layout.py
          python3 tests/browser_tree_archive_copy.py
          python3 tests/browser_training_grounds.py
      - name: 3D Training Grounds (WebGL2)
        if: ${{ !cancelled() }}
        run: python3 tests/browser_3d_training_grounds.py
      - name: Spatial combat (WebGL2)
        if: ${{ !cancelled() }}
        run: python3 tests/browser_spatial_combat.py
      - name: Additional browser scenarios
        if: ${{ !cancelled() }}
        run: |
          status=0
          for scenario in tests/browser_*.py; do
            case "$scenario" in
              tests/browser_helpers.py|tests/browser_calculation.py|tests/browser_talent_regression.py|tests/browser_combat_effects.py|tests/browser_ability_scopes.py|tests/browser_calculator_layout.py|tests/browser_tree_archive_copy.py|tests/browser_training_grounds.py|tests/browser_3d_training_grounds.py|tests/browser_spatial_combat.py)
                continue ;;
            esac
            echo "::group::$scenario"
            python3 "$scenario" || status=1
            echo "::endgroup::"
          done
          exit "$status"
